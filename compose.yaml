name: polaris

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_BACKEND_URL: /backend
        VITE_ML_API_URL: /ml
        VITE_SOCKET_URL: ""
        VITE_SOCKET_PATH: /backend/socket.io
        VITE_DATA_MODE: ${VITE_DATA_MODE:-CONNECTED}
        VITE_SUPABASE_URL: ${SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      ml:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      PORT: 5000
      NODE_ENV: production
      DEMO_MODE: ${DEMO_MODE:-false}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      FASTAPI_URL: http://ml:8000
      DEVICE_INGEST_API_KEY: ${DEVICE_INGEST_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SIMULATED_BANDWIDTH_KBPS: ${SIMULATED_BANDWIDTH_KBPS:-64}
      NORMAL_PACKET_PROCESSING_INTERVAL_MS: ${NORMAL_PACKET_PROCESSING_INTERVAL_MS:-800}
      EMERGENCY_PACKET_PROCESSING_INTERVAL_MS: ${EMERGENCY_PACKET_PROCESSING_INTERVAL_MS:-50}
      BASE_PROPAGATION_DELAY_MS: ${BASE_PROPAGATION_DELAY_MS:-250}
    expose:
      - "5000"
    restart: unless-stopped
    logging: *default-logging

  ml:
    build:
      context: .
      dockerfile: deploy/fastapi.Dockerfile
    environment:
      APP_NAME: POLARIS Antarctic Digital Twin Backend
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: "false"
      DEMO_MODE: ${DEMO_MODE:-false}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      DEVICE_INGEST_API_KEY: ${DEVICE_INGEST_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-1.5-flash}
      WS_TICK_INTERVAL_SECONDS: ${WS_TICK_INTERVAL_SECONDS:-1.5}
      SIMULATION_MAX_DAYS: ${SIMULATION_MAX_DAYS:-90}
      ALLOW_SYNTHETIC_ML: ${ALLOW_SYNTHETIC_ML:-false}
    expose:
      - "8000"
    restart: unless-stopped
    logging: *default-logging

  simulator:
    profiles: ["simulation"]
    build:
      context: .
      dockerfile: deploy/simulator.Dockerfile
    environment:
      BACKEND_URL: http://backend:5000
      DEVICE_INGEST_API_KEY: ${DEVICE_INGEST_API_KEY:-}
      TELEMETRY_INTERVAL_MS: ${TELEMETRY_INTERVAL_MS:-2000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
